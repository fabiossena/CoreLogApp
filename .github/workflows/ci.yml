# ---------------------------------------------------------------------------
# CoreLog Mobile + Web — CI/CD pipeline (GitHub Actions).
#
# Mirrors the "Build → Test → Scan → Deploy" stage of the reference MVVM
# architecture: unit tests for both apps run before any image is built, and
# the dashboard image is only pushed after tests are green.
#
# All logs are emitted in a structured way so they can be shipped to the same
# OpenTelemetry collector used at runtime.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # TEST — both applications, in parallel (independent layers).
  # ---------------------------------------------------------------------------
  test-web:
    name: Web · build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore web/CoreLog.Web.csproj web.Tests/CoreLog.Web.Tests.csproj
      - name: Build
        run: dotnet build web/CoreLog.Web.csproj --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test web.Tests/CoreLog.Web.Tests.csproj --configuration Release --no-restore

  test-mobile:
    name: Mobile · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test

  # ---------------------------------------------------------------------------
  # SCAN — container image build with a lightweight vulnerability scan.
  # ---------------------------------------------------------------------------
  scan:
    name: Docker · build & scan
    runs-on: ubuntu-latest
    needs: [test-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build dashboard image
        run: docker build -f Dockerfile.web -t corelog-web:${{ github.sha }} .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: corelog-web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # DEPLOY — only from main, after tests and scan are green.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy · Kubernetes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-web, test-mobile, scan]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: kubectl kustomize deploy/k8s > /dev/null
      # - name: Set image and apply
      #   run: |
      #     cd deploy/k8s
      #     kustomize edit set image corelog-web=<registry>/corelog-web:${{ github.sha }}
      #     kubectl apply -k .