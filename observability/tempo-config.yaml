# ---------------------------------------------------------------------------
# Tempo — local/single-binary trace backend.
# Receives OTLP traces from the OpenTelemetry Collector (otlp/tempo exporter)
# and is queried by Grafana over http://tempo:3200.
# ---------------------------------------------------------------------------
server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   # consumed by the collector inside the network
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h           # 7 days, aligned with the CoreLog retention

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

querier:
  frontend_worker:
    frontend_address: tempo:9095

metrics_generator:
  registry:
    external_labels:
      source: tempo
  traces_storage:
    path: /tmp/generator/traces
  processor:
    # Processors are activated per-tenant through `overrides` below.
    service_graphs: {}
    span_metrics: {}

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false