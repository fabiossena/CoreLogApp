# ---------------------------------------------------------------------------
# Prometheus — scrapes the OpenTelemetry Collector's Prometheus exporter.
# ---------------------------------------------------------------------------
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: corelog-mvvm

scrape_configs:
  # Metrics produced by the OTel collector pipeline (service metrics from
  # web/mobile/CoreLog, plus the collector's own health endpoint).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          signal: application

  # Self-observability of the collector process.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # Grafana itself, so dashboard availability is monitored too.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]