# ---------------------------------------------------------------------------
# CoreLog Mobile + Web — Kustomize overlay.
#   kubectl apply -k deploy/k8s
#
# Before applying, set the image to your registry:
#   cd deploy/k8s && kustomize edit set image corelog-web=<registry>/corelog-web:1.0.0
#
# The manifests mirror docker-compose.yml one service at a time, so migrating
# from compose to Kubernetes is a configuration change, not a redesign.
# ---------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: corelog

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 20-web.yaml
  - 30-otel-collector.yaml
  - 40-observability.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/version: "1.0.0"

images:
  - name: corelog-web
    newName: corelog-web
    newTag: "1.0.0"