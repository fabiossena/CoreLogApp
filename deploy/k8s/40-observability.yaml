# ---------------------------------------------------------------------------
# Observability backends — Loki, Tempo, Prometheus, Grafana.
# Same roles as the docker-compose services; storage uses emptyDir (demo) —
# swap for PersistentVolumeClaims before production use.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: corelog
  labels: { app.kubernetes.io/name: loki, app.kubernetes.io/part-of: corelog }
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: true
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: corelog
  labels: { app: loki, app.kubernetes.io/part-of: corelog }
spec:
  replicas: 1
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki, app.kubernetes.io/part-of: corelog }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.2.0
          args: ["-config.file=/etc/loki/local-config.yaml"]
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: corelog
  labels: { app: loki, app.kubernetes.io/part-of: corelog }
spec:
  type: ClusterIP
  selector: { app: loki }
  ports:
    - { name: http, port: 3100, targetPort: http }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: corelog
  labels: { app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: corelog }
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: { endpoint: 0.0.0.0:4317 }
            http: { endpoint: 0.0.0.0:4318 }
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 168h
    storage:
      trace:
        backend: local
        wal: { path: /tmp/tempo/wal }
        local: { path: /tmp/tempo/blocks }
    querier:
      frontend_worker:
        frontend_address: tempo:9095
    metrics_generator:
      registry:
        external_labels: { source: tempo }
      traces_storage: { path: /tmp/generator/traces }
      processor:
        service_graphs: {}
        span_metrics: {}
    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
    usage_report:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: corelog
  labels: { app: tempo, app.kubernetes.io/part-of: corelog }
spec:
  replicas: 1
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo, app.kubernetes.io/part-of: corelog }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0
          args: ["-config.file=/etc/tempo.yaml"]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo.yaml, subPath: tempo.yaml }
            - { name: data, mountPath: /tmp/tempo }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: corelog
  labels: { app: tempo, app.kubernetes.io/part-of: corelog }
spec:
  type: ClusterIP
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: corelog
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: corelog }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      external_labels: { stack: corelog-mvvm }
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector.corelog.svc.cluster.local:8889"]
      - job_name: grafana
        static_configs:
          - targets: ["grafana.corelog.svc.cluster.local:3000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: corelog
  labels: { app: prometheus, app.kubernetes.io/part-of: corelog }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus, app.kubernetes.io/part-of: corelog }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
          ports:
            - { name: http, containerPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: corelog
  labels: { app: prometheus, app.kubernetes.io/part-of: corelog }
spec:
  type: ClusterIP
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: http }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: corelog
  labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: corelog }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.corelog.svc.cluster.local:3100
        editable: true
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.corelog.svc.cluster.local:3200
        editable: true
        jsonData:
          tracesToLogs:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph: { enabled: true }
          lokiSearch: { datasourceUid: loki }
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.corelog.svc.cluster.local:9090
        isDefault: true
        editable: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: corelog
  labels: { app: grafana, app.kubernetes.io/part-of: corelog }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana, app.kubernetes.io/part-of: corelog }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: data, mountPath: /var/lib/grafana }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: corelog
  labels: { app: grafana, app.kubernetes.io/part-of: corelog }
spec:
  type: ClusterIP
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: http }